<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BistroIQ - Panel de Mesera</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col pb-24">

  <!-- Encabezado Mesera -->
  <header class="bg-slate-800 border-b border-slate-700 p-4 sticky top-0 z-50 flex justify-between items-center shadow-md">
    <div class="flex items-center gap-3">
      <div class="bg-indigo-500/20 p-2 rounded-xl border border-indigo-500/30">
        <i class="fa-solid fa-user-tie text-indigo-400 text-xl" aria-hidden="true"></i>
      </div>
      <div>
        <h1 class="font-bold text-lg text-white">Atención a Mesas</h1>
        <p class="text-xs text-indigo-300 font-medium">Panel de Mesera • BistroIQ</p>
      </div>
    </div>
    <div class="flex items-center gap-2">
      <button id="btn-sonido-mesera" onclick="activarSonidoMesera()" class="bg-indigo-600 hover:bg-indigo-500 text-white px-3 py-1.5 rounded-xl text-xs font-bold transition active:scale-95 shadow flex items-center gap-1.5">
        <i class="fa-solid fa-volume-high"></i> Activar Sonido
      </button>
      <button onclick="volverInicio()" class="bg-slate-700 hover:bg-slate-600 text-slate-300 px-3 py-1.5 rounded-xl text-xs font-semibold transition active:scale-95">
        <i class="fa-solid fa-house"></i> Salir
      </button>
    </div>
  </header>

  <main class="flex-1 p-4 max-w-4xl mx-auto w-full space-y-6">

    <!-- Sección 1: Solicitudes de Cuenta (Efectivo / Transferencia) -->
    <section class="bg-slate-800 border border-emerald-500/30 rounded-2xl p-5 shadow-lg space-y-3">
      <div class="flex justify-between items-center pb-2 border-b border-slate-700">
        <h2 class="font-bold text-emerald-400 text-sm flex items-center gap-2">
          <i class="fa-solid fa-file-invoice-dollar animate-bounce"></i> Solicitudes de Cuenta (Mesas)
        </h2>
        <span id="contador-cuentas" class="bg-emerald-500/20 text-emerald-300 text-xs px-2.5 py-1 rounded-full font-semibold">0 Cuentas</span>
      </div>
      <div id="contenedor-cuentas-mesera" class="space-y-2">
        <div class="text-center text-slate-400 text-xs py-3">No hay solicitudes de cuenta pendientes.</div>
      </div>
    </section>

    <!-- Sección 2: Avisos de Cocina -->
    <section class="bg-slate-800 border border-amber-500/30 rounded-2xl p-5 shadow-lg space-y-3">
      <div class="flex justify-between items-center pb-2 border-b border-slate-700">
        <h2 class="font-bold text-amber-400 text-sm flex items-center gap-2">
          <i class="fa-solid fa-bell-concierge animate-pulse"></i> Platos Listos para Recoger en Cocina
        </h2>
        <span id="contador-pedidos-listos" class="bg-amber-500/20 text-amber-300 text-xs px-2.5 py-1 rounded-full font-semibold">0 Listos</span>
      </div>
      <div id="contenedor-pedidos-listos" class="space-y-2">
        <div class="text-center text-slate-400 text-xs py-3">No hay platos listos en cocina.</div>
      </div>
    </section>

    <!-- Sección 3: Llamados de Clientes -->
    <section class="bg-slate-800 border border-slate-700 rounded-2xl p-5 shadow-lg space-y-3">
      <div class="flex justify-between items-center pb-2 border-b border-slate-700">
        <h2 class="font-bold text-slate-200 text-sm flex items-center gap-2">
          <i class="fa-solid fa-bell text-amber-400"></i> Llamados de Clientes
        </h2>
        <span id="contador-alertas-mesera" class="bg-amber-500/20 text-amber-300 text-xs px-2.5 py-1 rounded-full font-semibold">0 Llamados</span>
      </div>
      <div id="contenedor-alertas-mesera" class="space-y-2">
        <div class="text-center text-slate-400 text-xs py-3">No hay llamadas pendientes.</div>
      </div>
    </section>

  </main>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { 
      getFirestore, 
      collection, 
      onSnapshot, 
      doc,
      updateDoc,
      query,
      where 
    } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyDV780O1ZNeTaGFI3vCTbHpiLAzHO1hIf8",
      authDomain: "bistroiq-colombia.firebaseapp.com",
      projectId: "bistroiq-colombia",
      storageBucket: "bistroiq-colombia.firebasestorage.app",
      messagingSenderId: "745222925239",
      appId: "1:745222925239:web:12d0ecca6b65f1e15c1632"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    let audioCtx = null;
    let sonidoHabilitado = false;

    window.activarSonidoMesera = function() {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      if (audioCtx.state === 'suspended') audioCtx.resume();
      sonidoHabilitado = true;
      const btn = document.getElementById("btn-sonido-mesera");
      btn.className = "bg-emerald-600 text-white px-3 py-1.5 rounded-xl text-xs font-bold shadow flex items-center gap-1.5";
      btn.innerHTML = `<i class="fa-solid fa-volume-high"></i> Sonido Listo`;
      reproducirAlerta();
    };

    function reproducirAlerta() {
      if (!audioCtx || !sonidoHabilitado) return;
      try {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(600, audioCtx.currentTime);
        gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.6);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + 0.6);
      } catch (e) {
        console.error(e);
      }
    }

    // Escuchar Cuentas
    const qCuentas = query(collection(db, "alertas"), where("tipo", "==", "PEDIR_CUENTA"), where("atendido", "==", false));
    onSnapshot(qCuentas, (snapshot) => {
      const contenedor = document.getElementById("contenedor-cuentas-mesera");
      document.getElementById("contador-cuentas").textContent = `${snapshot.size} Cuentas`;

      if (snapshot.docChanges().some(c => c.type === 'added')) reproducirAlerta();

      if (snapshot.empty) {
        contenedor.innerHTML = `<div class="text-center text-slate-400 text-xs py-3">No hay solicitudes de cuenta pendientes.</div>`;
        return;
      }

      contenedor.innerHTML = "";
      snapshot.forEach((docSnap) => {
        const cuenta = docSnap.data();
        const id = docSnap.id;
        const esEfectivo = cuenta.metodo === "EFECTIVO";

        const card = document.createElement("div");
        card.className = `p-3 rounded-xl border flex items-center justify-between gap-3 ${
          esEfectivo ? 'bg-emerald-950/30 border-emerald-500/40' : 'bg-indigo-950/30 border-indigo-500/40'
        }`;
        card.innerHTML = `
          <div>
            <span class="font-bold text-white text-xs">${cuenta.mesa || 'Mesa'} pide la cuenta</span>
            <p class="text-[11px] font-semibold ${esEfectivo ? 'text-emerald-300' : 'text-indigo-300'}">
              Pago: ${esEfectivo ? '💵 EFECTIVO' : '📲 TRANSFERENCIA'} • Total: $${Number(cuenta.total || 0).toLocaleString("es-CO")} COP
            </p>
          </div>
          <button onclick="atenderLlamado('${id}')" class="bg-emerald-600 text-white px-3 py-1.5 rounded-lg text-[11px] font-bold">Atendido</button>
        `;
        contenedor.appendChild(card);
      });
    });

    // Escuchar Alertas de Cocina
    const qListos = query(collection(db, "alertas"), where("tipo", "==", "PEDIDO_LISTO"), where("atendido", "==", false));
    onSnapshot(qListos, (snapshot) => {
      const contenedor = document.getElementById("contenedor-pedidos-listos");
      document.getElementById("contador-pedidos-listos").textContent = `${snapshot.size} Listos`;

      if (snapshot.docChanges().some(c => c.type === 'added')) reproducirAlerta();

      if (snapshot.empty) {
        contenedor.innerHTML = `<div class="text-center text-slate-400 text-xs py-3">No hay platos listos en cocina.</div>`;
        return;
      }

      contenedor.innerHTML = "";
      snapshot.forEach((docSnap) => {
        const alerta = docSnap.data();
        const id = docSnap.id;

        const card = document.createElement("div");
        card.className = "bg-emerald-950/30 border border-emerald-500/40 p-3.5 rounded-xl flex items-center justify-between gap-3";
        card.innerHTML = `
          <span class="font-bold text-white text-xs">${alerta.mensaje}</span>
          <button onclick="atenderLlamado('${id}')" class="bg-emerald-600 text-white px-3.5 py-1.5 rounded-xl text-xs font-bold">Entregado</button>
        `;
        contenedor.appendChild(card);
      });
    });

    // Escuchar Llamados
    const qAlertas = query(collection(db, "alertas"), where("tipo", "==", "LLAMAR_MESERA"), where("atendido", "==", false));
    onSnapshot(qAlertas, (snapshot) => {
      const contenedor = document.getElementById("contenedor-alertas-mesera");
      document.getElementById("contador-alertas-mesera").textContent = `${snapshot.size} Llamados`;

      if (snapshot.empty) {
        contenedor.innerHTML = `<div class="text-center text-slate-400 text-xs py-3">No hay llamadas pendientes.</div>`;
        return;
      }

      contenedor.innerHTML = "";
      snapshot.forEach((docSnap) => {
        const alerta = docSnap.data();
        const id = docSnap.id;

        const card = document.createElement("div");
        card.className = "bg-amber-950/30 border border-amber-500/40 p-3 rounded-xl flex items-center justify-between gap-3";
        card.innerHTML = `
          <span class="font-bold text-white text-xs">${alerta.mesa} solicita atención</span>
          <button onclick="atenderLlamado('${id}')" class="bg-amber-600 text-white px-3 py-1 rounded-lg text-[11px] font-bold">Atendido</button>
        `;
        contenedor.appendChild(card);
      });
    });

    window.atenderLlamado = async function(id) {
      try {
        await updateDoc(doc(db, "alertas", id), { atendido: true });
      } catch (e) {
        console.error(e);
      }
    };

    window.volverInicio = function() {
      window.location.href = 'index.html';
    };
  </script>
</body>
</html>
