<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BistroIQ - Panel de Mesera</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col pb-24" onclick="desbloquearAudioMesera()">

  <!-- Encabezado Mesera -->
  <header class="bg-slate-800 border-b border-slate-700 p-3 sticky top-0 z-50 flex justify-between items-center shadow-md">
    <div class="flex items-center gap-2 overflow-hidden">
      <div class="bg-indigo-500/20 p-2 rounded-xl border border-indigo-500/30 shrink-0">
        <i class="fa-solid fa-user-tie text-indigo-400 text-lg" aria-hidden="true"></i>
      </div>
      <div class="truncate">
        <h1 class="font-bold text-sm sm:text-base text-white leading-tight truncate">Atención a Mesas</h1>
        <p class="text-[10px] sm:text-xs text-indigo-300 font-medium truncate">Panel de Mesera</p>
      </div>
    </div>
    
    <!-- Botones de Acción y Sonido -->
    <div class="flex items-center gap-1.5 shrink-0">
      <button id="btn-sonido-mesera" onclick="activarSonidoMesera(event)" class="bg-indigo-600 hover:bg-indigo-500 text-white px-2.5 py-1.5 rounded-xl text-[11px] font-bold transition active:scale-95 shadow flex items-center gap-1">
        <i class="fa-solid fa-volume-xmark text-xs"></i> <span>Sonido</span>
      </button>
      <button onclick="volverInicio()" class="bg-slate-700 hover:bg-slate-600 text-slate-300 px-2.5 py-1.5 rounded-xl text-[11px] font-semibold transition active:scale-95 flex items-center gap-1">
        <i class="fa-solid fa-house text-xs"></i> Salir
      </button>
    </div>
  </header>

  <!-- Contenido Principal -->
  <main class="flex-1 p-4 max-w-4xl mx-auto w-full space-y-6">

    <!-- Sección 1: Solicitudes de Cuenta (Efectivo / Transferencia) -->
    <section class="bg-slate-800 border border-emerald-500/30 rounded-2xl p-5 shadow-lg space-y-3">
      <div class="flex justify-between items-center pb-2 border-b border-slate-700">
        <h2 class="font-bold text-emerald-400 text-sm flex items-center gap-2">
          <i class="fa-solid fa-file-invoice-dollar text-emerald-400 animate-bounce" aria-hidden="true"></i> Solicitudes de Cuenta (Mesas)
        </h2>
        <span id="contador-cuentas" class="bg-emerald-500/20 text-emerald-300 text-xs px-2.5 py-1 rounded-full font-semibold">0 Cuentas</span>
      </div>
      <div id="contenedor-cuentas-mesera" class="space-y-2">
        <div class="text-center text-slate-400 text-xs py-3">No hay solicitudes de cuenta pendientes.</div>
      </div>
    </section>

    <!-- Sección 2: Avisos de Cocina (Comandas Listas para Servir) -->
    <section class="bg-slate-800 border border-amber-500/30 rounded-2xl p-5 shadow-lg space-y-3">
      <div class="flex justify-between items-center pb-2 border-b border-slate-700">
        <h2 class="font-bold text-amber-400 text-sm flex items-center gap-2">
          <i class="fa-solid fa-bell-concierge animate-pulse" aria-hidden="true"></i> Platos Listos para Recoger en Cocina
        </h2>
        <span id="contador-pedidos-listos" class="bg-amber-500/20 text-amber-300 text-xs px-2.5 py-1 rounded-full font-semibold">0 Listos</span>
      </div>
      <div id="contenedor-pedidos-listos" class="space-y-2">
        <div class="text-center text-slate-400 text-xs py-3">No hay platos listos para entregar en este momento.</div>
      </div>
    </section>

    <!-- Sección 3: Llamados de Clientes en Tiempo Real -->
    <section class="bg-slate-800 border border-slate-700 rounded-2xl p-5 shadow-lg space-y-3">
      <div class="flex justify-between items-center pb-2 border-b border-slate-700">
        <h2 class="font-bold text-slate-200 text-sm flex items-center gap-2">
          <i class="fa-solid fa-bell text-amber-400" aria-hidden="true"></i> Llamados de Clientes (Mesas)
        </h2>
        <span id="contador-alertas-mesera" class="bg-amber-500/20 text-amber-300 text-xs px-2.5 py-1 rounded-full font-semibold">0 Llamados</span>
      </div>
      <div id="contenedor-alertas-mesera" class="space-y-2">
        <div class="text-center text-slate-400 text-xs py-3">No hay llamadas pendientes de clientes.</div>
      </div>
    </section>

    <!-- Selector de Mesa Activa -->
    <section class="bg-slate-800 border border-slate-700 rounded-2xl p-5 shadow-lg space-y-3">
      <label class="text-xs font-bold text-slate-300 block">Selecciona la Mesa a Atender (Para clientes sin celular o adultos mayores):</label>
      <div class="grid grid-cols-4 sm:grid-cols-6 gap-2" id="grid-mesas-selector">
        <button onclick="seleccionarMesa('Mesa #1')" class="btn-mesa bg-slate-900 border border-slate-700 hover:border-indigo-500 p-2.5 rounded-xl text-xs font-bold text-center text-slate-200 transition">Mesa 1</button>
        <button onclick="seleccionarMesa('Mesa #2')" class="btn-mesa bg-slate-900 border border-slate-700 hover:border-indigo-500 p-2.5 rounded-xl text-xs font-bold text-center text-slate-200 transition">Mesa 2</button>
        <button onclick="seleccionarMesa('Mesa #3')" class="btn-mesa bg-slate-900 border border-slate-700 hover:border-indigo-500 p-2.5 rounded-xl text-xs font-bold text-center text-slate-200 transition border-indigo-500 bg-indigo-950/40">Mesa 3</button>
        <button onclick="seleccionarMesa('Mesa #4')" class="btn-mesa bg-slate-900 border border-slate-700 hover:border-indigo-500 p-2.5 rounded-xl text-xs font-bold text-center text-slate-200 transition">Mesa 4</button>
        <button onclick="seleccionarMesa('Mesa #5')" class="btn-mesa bg-slate-900 border border-slate-700 hover:border-indigo-500 p-2.5 rounded-xl text-xs font-bold text-center text-slate-200 transition">Mesa 5</button>
        <button onclick="seleccionarMesa('Mesa #6')" class="btn-mesa
