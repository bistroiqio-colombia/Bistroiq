<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BistroIQ - Monitor de Cocina (KDS)</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col pb-12">

  <!-- Encabezado de Cocina -->
  <header class="bg-slate-800 border-b border-slate-700 p-4 sticky top-0 z-50 flex justify-between items-center shadow-md">
    <div class="flex items-center gap-3">
      <div class="bg-amber-500/20 p-2 rounded-xl border border-amber-500/30">
        <i class="fa-solid fa-fire text-amber-500 text-xl" aria-hidden="true"></i>
      </div>
      <div>
        <h1 class="font-bold text-lg text-white">Monitor de Cocina (KDS)</h1>
        <p class="text-xs text-amber-300 font-medium">Gestión de Comandas e Insumos en Tiempo Real</p>
      </div>
    </div>
    <button onclick="volverInicio()" class="bg-slate-700 hover:bg-slate-600 text-slate-300 px-3 py-1.5 rounded-xl text-xs font-semibold transition" aria-label="Salir al portal">
      <i class="fa-solid fa-house" aria-hidden="true"></i> Salir
    </button>
  </header>

  <!-- Contenido Principal -->
  <main class="flex-1 p-4 max-w-4xl mx-auto w-full space-y-6">

    <!-- Comandas Entrantes desde Clientes y Mesera -->
    <section class="bg-slate-800 border border-slate-700 rounded-2xl p-5 shadow-lg space-y-4">
      <div class="flex justify-between items-center pb-2 border-b border-slate-700">
        <h2 class="font-bold text-slate-200 flex items-center gap-2">
          <i class="fa-solid fa-receipt text-amber-500" aria-hidden="true"></i> Comandas Activas en Cocina
        </h2>
        <span id="contador-comandas" class="bg-amber-500/20 text-amber-400 text-xs px-2.5 py-1 rounded-full font-semibold">0 Pendientes</span>
      </div>

      <div id="contenedor-comandas-cocina" class="space-y-3">
        <div class="text-center text-slate-400 text-sm py-4">Cargando comandas en tiempo real...</div>
      </div>
    </section>

    <!-- Control de Inventario y Disponibilidad (Sincronizado con Administrador) -->
    <section class="bg-slate-800 border border-slate-700 rounded-2xl p-5 shadow-lg space-y-4">
      <div class="flex justify-between items-center pb-2 border-b border-slate-700">
        <div>
          <h2 class="font-bold text-slate-200 flex items-center gap-2">
            <i class="fa-solid fa-boxes-stacked text-indigo-400" aria-hidden="true"></i> Control Rápido de Disponibilidad de Platos
          </h2>
          <p class="text-xs text-slate-400 mt-0.5">Toca para marcar agotado/disponible en tiempo real</p>
        </div>
        <span id="contador-insumos" class="text-xs text-indigo-300 font-semibold bg-indigo-500/10 px-2.5 py-1 rounded-full border border-indigo-500/20">0 Platos</span>
      </div>

      <!-- Los platos creados en el Administrador se cargan dinámicamente aquí -->
      <div id="contenedor-control-insumos" class="grid grid-cols-1 sm:grid-cols-2 gap-3">
        <div class="text-center text-slate-400 text-xs py-4 col-span-full">Cargando catálogo de platos...</div>
      </div>
    </section>

  </main>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { 
      getFirestore, 
      collection, 
      onSnapshot, 
      doc, 
      updateDoc,
      deleteDoc,
      query,
      where 
    } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyDV780O1ZNeTaGFI3vCTbHpiLAzHO1hIf8",
      authDomain: "bistroiq-colombia.firebaseapp.com",
      projectId: "bistroiq-colombia",
      storageBucket: "bistroiq-colombia.firebasestorage.app",
      messagingSenderId: "745222925239",
      appId: "1:745222925239:web:12d0ecca6b65f1e15c1632"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    // 1. Escuchar Comandas de Cocina
    const qCocina = query(collection(db, "pedidos_cocina"), where("estado", "in", ["PENDIENTE", "EN_PREPARACION"]));
    onSnapshot(qCocina, (snapshot) => {
      const contenedor = document.getElementById("contenedor-comandas-cocina");
      const contador = document.getElementById("contador-comandas");
      
      contador.textContent = `${snapshot.size} Pendientes`;

      if (snapshot.empty) {
        contenedor.innerHTML = `<div class="text-center text-slate-400 text-sm py-4">No hay comandas pendientes en este momento.</div>`;
        return;
      }

      contenedor.innerHTML = "";
      snapshot.forEach((docSnap) => {
        const pedido = docSnap.data();
        const id = docSnap.id;

        const card = document.createElement("div");
        card.className = "bg-slate-900/80 border border-slate-700 p-4 rounded-xl flex flex-col md:flex-row md:items-center justify-between gap-4";
        
        card.innerHTML = `
          <div>
            <div class="flex items-center gap-2">
              <span class="font-bold text-white text-base">${pedido.mesa || 'Mesa'} — Comanda #${pedido.comanda || '00'}</span>
              <span class="text-xs px-2 py-0.5 rounded font-bold ${pedido.estado === 'EN_PREPARACION' ? 'bg-amber-500/20 text-amber-300 border border-amber-500/30' : 'bg-indigo-500/20 text-indigo-300 border border-indigo-500/30'}">
                ${pedido.estado === 'EN_PREPARACION' ? 'En Preparación' : 'Pendiente'}
              </span>
            </div>
            <div class="text-sm font-semibold text-amber-400 mt-1">${pedido.resumen || 'Sin especificar'}</div>
          </div>
          <div class="flex items-center gap-2">
            <button onclick="cambiarEstadoPedido('${id}', 'EN_PREPARACION')" class="bg-amber-600 hover:bg-amber-500 text-white px-3 py-2 rounded-xl text-xs font-bold transition active:scale-95">
              En Preparación
            </button>
            <button onclick="cambiarEstadoPedido('${id}', 'LISTO')" class="bg-emerald-600 hover:bg-emerald-500 text-white px-3 py-2 rounded-xl text-xs font-bold transition active:scale-95">
              ¡Listo!
            </button>
            <button onclick="eliminarComandaIndividual('${id}', '${pedido.mesa || 'Mesa'}')" class="bg-rose-900/30 hover:bg-rose-900/50 text-rose-300 p-2.5 rounded-xl text-xs transition" title="Eliminar esta comanda">
              <i class="fa-solid fa-trash" aria-hidden="true"></i>
            </button>
          </div>
        `;
        contenedor.appendChild(card);
      });
    });

    // 2. Escuchar Catálogo Completo desde "inventario_insumos" para Control de Stock
    onSnapshot(collection(db, "inventario_insumos"), (snapshot) => {
      const contenedorInsumos = document.getElementById("contenedor-control-insumos");
      const contadorInsumos = document.getElementById("contador-insumos");

      contadorInsumos.textContent = `${snapshot.size} Platos`;

      if (snapshot.empty) {
        contenedorInsumos.innerHTML = `<div class="text-center text-slate-400 text-xs py-4 col-span-full">No hay platos registrados. Agrégalos desde el panel de Administrador.</div>`;
        return;
      }

      contenedorInsumos.innerHTML = "";
      snapshot.forEach((docSnap) => {
        const item = docSnap.data();
        const id = docSnap.id;
        const disponible = item.disponible !== undefined ? item.disponible : true;

        const btn = document.createElement("button");
        btn.onclick = () => toggleDisponibilidadCocina(id, disponible);
        btn.className = `p-3.5 rounded-xl border flex items-center justify-between text-left transition active:scale-95 font-semibold text-xs ${
          disponible 
            ? 'bg-emerald-950/30 border-emerald-500/40 text-emerald-300 hover:bg-emerald-900/40' 
            : 'bg-rose-950/30 border-rose-500/40 text-rose-300 hover:bg-rose-900/40'
        }`;

        btn.innerHTML = `
          <div class="flex items-center gap-2">
            <span class="w-2.5 h-2.5 rounded-full ${disponible ? 'bg-emerald-400 animate-pulse' : 'bg-rose-500'}"></span>
            <span class="truncate">${item.nombre}</span>
          </div>
          <span class="px-2 py-0.5 rounded text-[10px] uppercase font-bold shrink-0 ${
            disponible ? 'bg-emerald-500/20 text-emerald-300' : 'bg-rose-500/20 text-rose-300'
          }">
            ${disponible ? 'Disponible' : 'Agotado'}
          </span>
        `;
        contenedorInsumos.appendChild(btn);
      });
    });

    window.cambiarEstadoPedido = async function(id, nuevoEstado) {
      try {
        await updateDoc(doc(db, "pedidos_cocina", id), { estado: nuevoEstado });
      } catch (e) {
        console.error("Error al actualizar pedido", e);
      }
    };

    window.toggleDisponibilidadCocina = async function(id, estadoActual) {
      try {
        await updateDoc(doc(db, "inventario_insumos", id), { disponible: !estadoActual });
      } catch (e) {
        console.error("Error al cambiar estado de producto", e);
      }
    };

    // Función para eliminar una comanda individualmente con su icono de papelera
    window.eliminarComandaIndividual = async function(id, mesa) {
      if (confirm(`¿Deseas eliminar la comanda de la ${mesa}?`)) {
        try {
          await deleteDoc(doc(db, "pedidos_cocina", id));
        } catch (e) {
          console.error("Error al eliminar la comanda:", e);
          alert("⚠️ Ocurrió un error al intentar eliminar la comanda.");
        }
      }
    };

    window.volverInicio = function() {
      window.location.href = 'index.html';
    };
  </script>
</body>
</html>
