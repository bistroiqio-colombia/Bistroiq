<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BistroIQ - Menú Digital</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
  <style>
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
  </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col pb-28">

  <!-- Encabezado -->
  <header class="bg-slate-800 border-b border-slate-700 p-4 sticky top-0 z-40 flex justify-between items-center shadow-md">
    <div class="flex items-center gap-3">
      <div class="bg-indigo-600/30 p-2.5 rounded-xl border border-indigo-500/30">
        <i class="fa-solid fa-utensils text-indigo-400 text-xl" aria-hidden="true"></i>
      </div>
      <div>
        <h1 class="font-black text-lg text-white tracking-wide">BistroIQ</h1>
        <p class="text-xs text-indigo-300 font-bold" id="label-mesa-header">Mesa #3 • Menú Interactivo</p>
      </div>
    </div>
    <button onclick="llamarMesera()" class="bg-amber-600 hover:bg-amber-500 text-white px-3.5 py-2 rounded-xl text-xs font-black transition active:scale-95 flex items-center gap-1.5 shadow-md">
      <i class="fa-solid fa-bell text-sm" aria-hidden="true"></i> Llamar Mesera
    </button>
  </header>

  <!-- Categorías / Pestañas -->
  <nav class="bg-slate-800/90 backdrop-blur-md border-b border-slate-700 p-3 sticky top-[69px] z-30">
    <div class="flex gap-2 overflow-x-auto no-scrollbar max-w-4xl mx-auto">
      <button onclick="filtrarCategoria('todas', this)" class="btn-cat bg-indigo-600 text-white px-4 py-2 rounded-xl text-xs font-black shrink-0 transition">
        📋 Todas
      </button>
      <button onclick="filtrarCategoria('sencillos', this)" class="btn-cat bg-slate-900 text-slate-300 hover:bg-slate-700 border border-slate-700 px-4 py-2 rounded-xl text-xs font-black shrink-0 transition">
        🍲 Sencillos
      </button>
      <button onclick="filtrarCategoria('asados', this)" class="btn-cat bg-slate-900 text-slate-300 hover:bg-slate-700 border border-slate-700 px-4 py-2 rounded-xl text-xs font-black shrink-0 transition">
        🥩 Asados
      </button>
      <button onclick="filtrarCategoria('bebidas', this)" class="btn-cat bg-slate-900 text-slate-300 hover:bg-slate-700 border border-slate-700 px-4 py-2 rounded-xl text-xs font-black shrink-0 transition">
        🥤 Bebidas
      </button>
      <button onclick="filtrarCategoria('porciones', this)" class="btn-cat bg-slate-900 text-slate-300 hover:bg-slate-700 border border-slate-700 px-4 py-2 rounded-xl text-xs font-black shrink-0 transition">
        🍟 Porciones
      </button>
    </div>
  </nav>

  <!-- Contenido Principal -->
  <main class="flex-1 p-4 max-w-4xl mx-auto w-full space-y-4">
    <div id="contenedor-menu" class="grid grid-cols-1 sm:grid-cols-2 gap-3.5">
      <div class="text-center text-slate-300 text-sm py-8 col-span-full font-bold">Cargando menú delicioso...</div>
    </div>
  </main>

  <!-- Barra Flotante de Carrito -->
  <footer id="barra-pedido" class="fixed bottom-0 left-0 right-0 bg-slate-800/95 backdrop-blur-md border-t border-slate-700 p-4 shadow-2xl z-40 hidden">
    <div class="max-w-4xl mx-auto flex items-center justify-between gap-3">
      <div>
        <p class="text-xs text-slate-300 font-bold" id="resumen-items-pie">0 productos agregados</p>
        <p class="text-xl font-black text-emerald-400" id="total-pedido">$ 0 COP</p>
      </div>
      <div class="flex items-center gap-2">
        <button onclick="abrirModalCuenta()" class="bg-emerald-600 hover:bg-emerald-500 text-white px-3.5 py-2.5 rounded-xl text-xs font-black transition active:scale-95 shadow-lg flex items-center gap-1.5">
          <i class="fa-solid fa-file-invoice-dollar text-sm"></i> Pedir Cuenta
        </button>
        <button onclick="enviarPedidoCocina()" class="bg-indigo-600 hover:bg-indigo-500 text-white px-4 py-2.5 rounded-xl text-xs font-black transition active:scale-95 shadow-lg flex items-center gap-1.5">
          <i class="fa-solid fa-paper-plane text-sm"></i> Enviar Pedido
        </button>
      </div>
    </div>
  </footer>

  <!-- Modal Pedir Cuenta -->
  <div id="modal-cuenta" class="fixed inset-0 bg-black/80 backdrop-blur-sm z-50 flex items-center justify-center p-4 hidden">
    <div class="bg-slate-800 border border-slate-700 rounded-2xl max-w-sm w-full p-6 space-y-5 shadow-2xl">
      <div class="flex justify-between items-center border-b border-slate-700 pb-3">
        <h3 class="text-lg font-black text-white flex items-center gap-2">
          <i class="fa-solid fa-file-invoice-dollar text-emerald-400"></i> Solicitar la Cuenta
        </h3>
        <button onclick="cerrarModalCuenta()" class="text-slate-400 hover:text-white text-lg"><i class="fa-solid fa-xmark"></i></button>
      </div>
      <div>
        <p class="text-xs text-slate-300 font-bold mb-1">Monto a pagar en mesa:</p>
        <p class="text-2xl font-black text-emerald-400" id="modal-monto-total">$ 0 COP</p>
      </div>
      <div class="space-y-3">
        <p class="text-xs font-bold text-slate-300">Selecciona tu método de pago:</p>
        <button onclick="confirmarPedirCuenta('EFECTIVO')" class="w-full bg-slate-900 border border-emerald-500/40 hover:border-emerald-500 p-3.5 rounded-xl text-left flex items-center justify-between transition group">
          <div>
            <p class="font-bold text-sm text-white group-hover:text-emerald-400">💵 Pago en Efectivo</p>
            <p class="text-xs text-slate-400">La mesera se acercará a cobrarte</p>
          </div>
          <i class="fa-solid fa-chevron-right text-slate-500 text-xs"></i>
        </button>
        <button onclick="confirmarPedirCuenta('TRANSFERENCIA')" class="w-full bg-slate-900 border border-indigo-500/40 hover:border-indigo-500 p-3.5 rounded-xl text-left flex items-center justify-between transition group">
          <div>
            <p class="font-bold text-sm text-white group-hover:text-indigo-400">📲 Transferencia Digital</p>
            <p class="text-xs text-slate-400">Nequi / DaviPlata (Muestra el comprobante)</p>
          </div>
          <i class="fa-solid fa-chevron-right text-slate-500 text-xs"></i>
        </button>
      </div>
    </div>
  </div>

  <!-- Script Firebase -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { 
      getFirestore, 
      collection, 
      onSnapshot, 
      addDoc 
    } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyDV780O1ZNeTaGFI3vCTbHpiLAzHO1hIf8",
      authDomain: "bistroiq-colombia.firebaseapp.com",
      projectId: "bistroiq-colombia",
      storageBucket: "bistroiq-colombia.firebasestorage.app",
      messagingSenderId: "745222925239",
      appId: "1:745222925239:web:12d0ecca6b65f1e15c1632"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    const mesaActual = "Mesa #3";
    let carrito = [];
    let menuCompleto = [];
    let filtroCat = "todas";

    onSnapshot(collection(db, "inventario_insumos"), (snapshot) => {
      menuCompleto = [];
      snapshot.forEach((docSnap) => {
        menuCompleto.push({ id: docSnap.id, ...docSnap.data() });
      });
      renderizarMenu();
    });

    function renderizarMenu() {
      const contenedor = document.getElementById("contenedor-menu");
      const lista = menuCompleto.filter(item => {
        if (filtroCat === "todas") return true;
        return (item.categoria || "").toLowerCase().includes(filtroCat);
      });

      if (lista.length === 0) {
        contenedor.innerHTML = `<div class="text-center text-slate-300 text-sm py-8 col-span-full font-bold">No hay platillos en esta sección.</div>`;
        return;
      }

      contenedor.innerHTML = "";
      lista.forEach((item) => {
        const disponible = item.disponible !== undefined ? item.disponible : true;
        const card = document.createElement("div");
        card.className = `bg-slate-800 border rounded-2xl p-4 flex justify-between items-center space-x-3 transition ${
          disponible ? 'border-slate-700 shadow-md' : 'border-rose-900/30 opacity-60'
        }`;

        card.innerHTML = `
          <div class="space-y-1 overflow-hidden">
            <h3 class="font-extrabold text-sm text-white truncate">${item.nombre}</h3>
            <p class="text-xs text-slate-300 line-clamp-2">${item.desc || 'Preparación especial del chef.'}</p>
            <p class="text-emerald-400 text-sm font-black">$ ${Number(item.precio || 0).toLocaleString("es-CO")} COP</p>
          </div>
          <div class="shrink-0">
            ${disponible 
              ? `<button onclick="agregarAlCarrito('${item.id}', '${item.nombre}',${item.precio})" class="bg-indigo-600 hover:bg-indigo-500 text-white px-3.5 py-2 rounded-xl text-xs font-black transition active:scale-95 flex items-center gap-1 shadow">
                  <i class="fa-solid fa-plus"></i> Añadir
                </button>`
              : `<span class="text-xs text-rose-400 font-bold italic">Agotado</span>`
            }
          </div>
        `;
        contenedor.appendChild(card);
      });
    }

    window.filtrarCategoria = function(cat, elemento) {
      filtroCat = cat;
      document.querySelectorAll('.btn-cat').forEach(btn => {
        btn.className = 'btn-cat bg-slate-900 text-slate-300 hover:bg-slate-700 border border-slate-700 px-4 py-2 rounded-xl text-xs font-black shrink-0 transition';
      });
      elemento.className = 'btn-cat bg-indigo-600 text-white px-4 py-2 rounded-xl text-xs font-black shrink-0 transition';
      renderizarMenu();
    };

    window.agregarAlCarrito = function(id, nombre, precio) {
      carrito.push({ id, nombre, precio });
      actualizarBarra();
    };

    function actualizarBarra() {
      const barra = document.getElementById("barra-pedido");
      const resumenText = document.getElementById("resumen-items-pie");
      const totalText = document.getElementById("total-pedido");

      if (carrito.length > 0) {
        const total = carrito.reduce((acc, item) => acc + item.precio, 0);
        resumenText.textContent = `${carrito.length} producto(s) en tu mesa`;
        totalText.textContent = `$ ${total.toLocaleString("es-CO")} COP`;
        document.getElementById("modal-monto-total").textContent = `$ ${total.toLocaleString("es-CO")} COP`;
        barra.classList.remove("hidden");
      } else {
        barra.classList.add("hidden");
      }
    }

    window.enviarPedidoCocina = async function() {
      if (carrito.length === 0) return;

      const resumen = carrito.map(i => i.nombre).join(", ");
      const total = carrito.reduce((acc, item) => acc + item.precio, 0);

      if (confirm(`¿Enviar tu pedido a Cocina?\n\nTotal: $${total.toLocaleString("es-CO")} COP`)) {
        try {
          await addDoc(collection(db, "pedidos_cocina"), {
            mesa: mesaActual,
            comanda: Math.floor(100 + Math.random() * 900),
            resumen: resumen,
            total: total,
            estado: "PENDIENTE",
            fecha: new Date().toISOString()
          });

          alert("🚀 ¡Tu pedido ha sido enviado a la Cocina!");
        } catch (e) {
          console.error("Error al enviar pedido:", e);
        }
      }
    };

    window.llamarMesera = async function() {
      try {
        await addDoc(collection(db, "alertas"), {
          mesa: mesaActual,
          tipo: "LLAMAR_MESERA",
          atendido: false,
          fecha: new Date().toISOString()
        });
        alert("🔔 Solicitud enviada. Un mesero vendrá a tu mesa en breve.");
      } catch (e) {
        console.error("Error al llamar mesera:", e);
      }
    };

    window.abrirModalCuenta = function() {
      document.getElementById("modal-cuenta").classList.remove("hidden");
    };

    window.cerrarModalCuenta = function() {
      document.getElementById("modal-cuenta").classList.add("hidden");
    };

    window.confirmarPedirCuenta = async function(metodo) {
      const total = carrito.reduce((acc, item) => acc + item.precio, 0);
      try {
        await addDoc(collection(db, "alertas"), {
          mesa: mesaActual,
          tipo: "PEDIR_CUENTA",
          metodo: metodo,
          total: total,
          atendido: false,
          fecha: new Date().toISOString()
        });

        cerrarModalCuenta();
        alert(`📄 Cuenta solicitada (${metodo}). La mesera/caja ya registraron tu solicitud.`);
      } catch (e) {
        console.error("Error al solicitar cuenta:", e);
      }
    };
  </script>
</body>
</html>
