<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BistroIQ - Monitor de Cocina</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col pb-12">

  <!-- Encabezado de Cocina -->
  <header class="bg-slate-800 border-b border-slate-700 p-4 sticky top-0 z-50 flex justify-between items-center shadow-md">
    <div class="flex items-center gap-3">
      <div class="bg-amber-600/30 p-2 rounded-xl border border-amber-500/30">
        <i class="fa-solid fa-fire text-amber-500 text-xl" aria-hidden="true"></i>
      </div>
      <div>
        <h1 class="font-bold text-lg text-white">Monitor de Cocina (KDS)</h1>
        <p class="text-xs text-amber-400 font-medium">Gestión de Comandas e Insumos en Tiempo Real</p>
      </div>
    </div>
    <button onclick="volverInicio()" class="bg-slate-700 hover:bg-slate-600 text-slate-300 px-3 py-1.5 rounded-xl text-xs font-semibold transition" aria-label="Salir al portal">
      <i class="fa-solid fa-house" aria-hidden="true"></i> Salir
    </button>
  </header>

  <!-- Contenido Principal -->
  <main class="flex-1 p-4 max-w-4xl mx-auto w-full space-y-6">

    <!-- Sección de Comandas Entrantes -->
    <section class="bg-slate-800 border border-slate-700 rounded-2xl p-5 shadow-lg space-y-4">
      <div class="flex justify-between items-center pb-2 border-b border-slate-700">
        <h2 class="font-bold text-slate-200 flex items-center gap-2">
          <i class="fa-solid fa-list-check text-amber-500" aria-hidden="true"></i> Comandas Activas
        </h2>
        <span id="contador-comandas" class="bg-amber-500/20 text-amber-400 text-xs px-2.5 py-1 rounded-full font-semibold">0 En Marcha</span>
      </div>

      <div id="contenedor-comandas" class="grid grid-cols-1 md:grid-cols-2 gap-4">
        <div class="text-center text-slate-400 text-sm py-4 col-span-2">Cargando comandas en tiempo real...</div>
      </div>
    </section>

    <!-- Control de Insumos / Agotados Sincronizado -->
    <section class="bg-slate-800 border border-slate-700 rounded-2xl p-5 shadow-lg space-y-3">
      <div class="flex justify-between items-center pb-2 border-b border-slate-700">
        <h2 class="font-bold text-slate-200 flex items-center gap-2">
          <i class="fa-solid fa-boxes-stacked text-indigo-400" aria-hidden="true"></i> Control Rápido de Disponibilidad de Insumos
        </h2>
        <span class="text-xs text-slate-400">Toca para alternar estado en tiempo real</span>
      </div>

      <div id="contenedor-insumos" class="flex flex-wrap gap-2 pt-1">
        <!-- Se cargarán dinámicamente desde Firebase -->
        <div class="text-xs text-slate-400 py-2">Sincronizando disponibilidad de insumos...</div>
      </div>
    </section>

  </main>

  <!-- Script de Navegación, Firebase & KDS -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { 
      getFirestore, 
      collection, 
      onSnapshot, 
      doc, 
      updateDoc, 
      setDoc,
      query, 
      where 
    } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    // Configuración Firebase BistroIQ Colombia
    const firebaseConfig = {
      apiKey: "AIzaSyDV780O1ZNeTaGFI3vCTbHpiLAzHO1hIf8",
      authDomain: "bistroiq-colombia.firebaseapp.com",
      projectId: "bistroiq-colombia",
      storageBucket: "bistroiq-colombia.firebasestorage.app",
      messagingSenderId: "745222925239",
      appId: "1:745222925239:web:12d0ecca6b65f1e15c1632"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    // 1. Escuchar comandas activas en la colección "pedidos_cocina"
    const qCocina = query(collection(db, "pedidos_cocina"), where("estado", "!=", "ENTREGADO"));
    onSnapshot(qCocina, (snapshot) => {
      const contenedor = document.getElementById("contenedor-comandas");
      const contador = document.getElementById("contador-comandas");
      
      contador.textContent = `${snapshot.size} En Marcha`;

      if (snapshot.empty) {
        contenedor.innerHTML = `<div class="text-center text-slate-400 text-sm py-4 col-span-2">No hay comandas activas en este momento. Esperando nuevos pedidos...</div>`;
        return;
      }

      contenedor.innerHTML = "";
      snapshot.forEach((docSnap) => {
        const pedido = docSnap.data();
        const id = docSnap.id;
        const esPreparando = pedido.estado === "EN_PREPARACION";
        const esListo = pedido.estado === "LISTO";

        const card = document.createElement("div");
        card.className = `bg-slate-900/80 border ${esListo ? 'border-emerald-500' : esPreparando ? 'border-amber-500' : 'border-slate-700'} rounded-xl p-4 flex flex-col justify-between space-y-3 shadow-md`;
        
        card.innerHTML = `
          <div>
            <div class="flex justify-between items-center border-b border-slate-800 pb-2 mb-2">
              <span class="font-bold text-amber-400 text-base">${pedido.mesa || 'Mesa'} — Comanda #${pedido.comanda || '00'}</span>
              <span class="text-xs ${esListo ? 'bg-emerald-900/60 text-emerald-300 border border-emerald-500/40' : esPreparando ? 'bg-amber-900/60 text-amber-300 border border-amber-500/40' : 'bg-slate-800 text-slate-400'} px-2 py-0.5 rounded font-bold">
                ${pedido.estado || 'PENDIENTE'}
              </span>
            </div>
            <div class="text-sm space-y-1 text-slate-200 font-medium">
              ${pedido.resumen || '1x Plato principal'}
            </div>
          </div>
          <div class="flex gap-2 pt-2">
            <button onclick="marcarPreparando('${id}', '${pedido.mesa}')" class="flex-1 bg-amber-600 hover:bg-amber-500 text-white py-2 rounded-lg text-xs font-bold transition active:scale-95">
              En Preparación
            </button>
            <button onclick="marcarListo('${id}', '${pedido.mesa}')" class="flex-1 bg-emerald-600 hover:bg-emerald-500 text-white py-2 rounded-lg text-xs font-bold transition active:scale-95">
              ¡Listo!
            </button>
          </div>
        `;
        contenedor.appendChild(card);
      });
    });

    // 2. Escuchar Inventario / Insumos en Tiempo Real desde Firebase
    const insumosPorDefecto = [
      { id: 'arroz_pollo', nombre: 'Arroz con Pollo Especial', disponible: true },
      { id: 'pasta_bolonesa', nombre: 'Pasta a la Boloñesa', disponible: true },
      { id: 'pechuga_gratinada', nombre: 'Pechuga Gratinada', disponible: true },
      { id: 'limonada_coco', nombre: 'Limonada de Coco', disponible: true },
      { id: 'cerveza_aguila', nombre: 'Cerveza Águila Light', disponible: true }
    ];

    onSnapshot(collection(db, "inventario_insumos"), async (snapshot) => {
      const contenedorInsumos = document.getElementById("contenedor-insumos");

      // Si la colección está vacía en Firebase, la inicializamos automáticamente
      if (snapshot.empty) {
        for (let item of insumosPorDefecto) {
          await setDoc(doc(db, "inventario_insumos", item.id), item);
        }
        return;
      }

      contenedorInsumos.innerHTML = "";
      snapshot.forEach((docInsumo) => {
        const data = docInsumo.data();
        const id = docInsumo.id;
        const disponible = data.disponible;

        const btn = document.createElement("button");
        btn.onclick = () => toggleInsumoFirebase(id, !disponible);
        
        if (disponible) {
          btn.className = "bg-emerald-900/40 border border-emerald-500/50 text-emerald-300 px-3.5 py-2 rounded-xl text-xs font-semibold transition active:scale-95 flex items-center gap-2";
          btn.innerHTML = `<i class="fa-solid fa-circle text-[10px] text-emerald-400" aria-hidden="true"></i> ${data.nombre}: Disponible`;
        } else {
          btn.className = "bg-red-900/40 border border-red-500/50 text-red-300 px-3.5 py-2 rounded-xl text-xs font-semibold transition active:scale-95 flex items-center gap-2";
          btn.innerHTML = `<i class="fa-solid fa-circle text-[10px] text-red-400" aria-hidden="true"></i> ${data.nombre}: Agotado`;
        }

        contenedorInsumos.appendChild(btn);
      });
    });

    window.toggleInsumoFirebase = async function(idInsumo, nuevoEstado) {
      try {
        const refDoc = doc(db, "inventario_insumos", idInsumo);
        await updateDoc(refDoc, { disponible: nuevoEstado });
      } catch (e) {
        console.error("Error al actualizar disponibilidad", e);
      }
    };

    window.marcarPreparando = async function(id, mesa) {
      try {
        await updateDoc(doc(db, "pedidos_cocina", id), { estado: "EN_PREPARACION" });
      } catch (e) {
        console.error(e);
      }
    };

    window.marcarListo = async function(id, mesa) {
      try {
        await updateDoc(doc(db, "pedidos_cocina", id), { estado: "LISTO" });
      } catch (e) {
        console.error(e);
      }
    };

    window.volverInicio = function() {
      window.location.href = 'index.html';
    };
  </script>
</body>
</html>
