<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BistroIQ - Panel de Cocina (KDS)</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col pb-12" onclick="desbloquearAudioGeneral()">

  <!-- Encabezado Cocina -->
  <header class="bg-slate-800 border-b border-slate-700 p-4 sticky top-0 z-50 flex justify-between items-center shadow-md">
    <div class="flex items-center gap-3">
      <div class="bg-amber-500/20 p-2 rounded-xl border border-amber-500/30">
        <i class="fa-solid fa-fire text-amber-400 text-xl" aria-hidden="true"></i>
      </div>
      <div>
        <h1 class="font-bold text-lg text-white">Cocina & Comandas (KDS)</h1>
        <p class="text-xs text-amber-300 font-medium">BistroIQ Colombia</p>
      </div>
    </div>
    <div class="flex items-center gap-2">
      <button id="btn-sonido" onclick="activarSonidoCocina(event)" class="bg-indigo-600 hover:bg-indigo-500 text-white px-3 py-1.5 rounded-xl text-xs font-bold transition active:scale-95 shadow flex items-center gap-1.5">
        <i class="fa-solid fa-volume-xmark"></i> Activar Sonido
      </button>
      <button onclick="volverInicio()" class="bg-slate-700 hover:bg-slate-600 text-slate-300 px-3 py-1.5 rounded-xl text-xs font-semibold transition active:scale-95">
        <i class="fa-solid fa-house"></i> Salir
      </button>
    </div>
  </header>

  <!-- Contenido Principal -->
  <main class="flex-1 p-4 max-w-5xl mx-auto w-full space-y-6">
    
    <!-- Sección de Comandas Pendientes -->
    <div class="space-y-4">
      <div class="flex justify-between items-center pb-2 border-b border-slate-700">
        <h2 class="font-bold text-slate-200 text-sm flex items-center gap-2">
          <i class="fa-solid fa-list-check text-amber-400"></i> Comandas Pendientes por Preparar
        </h2>
        <span id="contador-comandas" class="bg-amber-500/20 text-amber-300 text-xs px-2.5 py-1 rounded-full font-semibold">0 Pendientes</span>
      </div>

      <div id="contenedor-comandas" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4">
        <div class="text-center text-slate-400 text-sm py-8 col-span-full">Esperando nuevas comandas en tiempo real...</div>
      </div>
    </div>

    <!-- Sección de Control de Menú (Platos Disponibles / Agotados) -->
    <section class="bg-slate-800/80 border border-slate-700 rounded-2xl p-4 shadow-lg space-y-3">
      <div class="flex justify-between items-center pb-2 border-b border-slate-700">
        <h2 class="font-bold text-slate-200 text-sm flex items-center gap-2">
          <i class="fa-solid fa-utensils text-indigo-400"></i> Control de Menú (Platos Disponibles / Agotados)
        </h2>
        <span class="text-xs text-slate-400">Pulsa para cambiar estado</span>
      </div>

      <div id="contenedor-control-menu" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-3">
        <div class="text-center text-slate-400 text-xs py-4 col-span-full">Cargando inventario de platillos...</div>
      </div>
    </section>

  </main>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { 
      getFirestore, 
      collection, 
      onSnapshot, 
      addDoc, 
      updateDoc, 
      doc,
      query, 
      where 
    } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyDV780O1ZNeTaGFI3vCTbHpiLAzHO1hIf8",
      authDomain: "bistroiq-colombia.firebaseapp.com",
      projectId: "bistroiq-colombia",
      storageBucket: "bistroiq-colombia.firebasestorage.app",
      messagingSenderId: "745222925239",
      appId: "1:745222925239:web:12d0ecca6b65f1e15c1632"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    let audioCtx = null;
    let sonidoHabilitado = false;
    let primeraCarga = true;

    window.desbloquearAudioGeneral = function() {
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      }
      if (audioCtx.state === 'suspended') {
        audioCtx.resume();
      }
    };

    window.activarSonidoCocina = function(e) {
      if (e) e.stopPropagation();
      window.desbloquearAudioGeneral();
      sonidoHabilitado = true;
      actualizarBotonSonido(true);
      reproducirAlarmaCocina();
    };

    function actualizarBotonSonido(activo) {
      const btn = document.getElementById("btn-sonido");
      if (activo) {
        btn.className = "bg-emerald-600 text-white px-3 py-1.5 rounded-xl text-xs font-bold shadow flex items-center gap-1.5";
        btn.innerHTML = `<i class="fa-solid fa-volume-high"></i> Sonido Activo`;
      }
    }

    // Alarma Potente Doble para Cocina (Buzzer de Comanda)
    function reproducirAlarmaCocina() {
      window.desbloquearAudioGeneral();
      if (!audioCtx) return;

      try {
        const emitirBeep = (frecuencia, inicio, duracion) => {
          const osc = audioCtx.createOscillator();
          const gain = audioCtx.createGain();
          osc.type = 'square'; // Onda cuadrada para un sonido más penetrante tipo comanda
          osc.frequency.setValueAtTime(frecuencia, audioCtx.currentTime + inicio);
          
          gain.gain.setValueAtTime(0.4, audioCtx.currentTime + inicio);
          gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + inicio + duracion);
          
          osc.connect(gain);
          gain.connect(audioCtx.destination);
          
          osc.start(audioCtx.currentTime + inicio);
          osc.stop(audioCtx.currentTime + inicio + duracion);
        };

        // Doble beep penetrante (Llegada de Comanda)
        emitirBeep(987.77, 0.0, 0.25); // Nota B5
        emitirBeep(1318.51, 0.3, 0.40); // Nota E6
      } catch (e) {
        console.error("Error reproduciendo audio:", e);
      }
    }

    // 1. Listener Firebase en Tiempo Real para Comandas Pendientes
    const qComandas = query(collection(db, "pedidos_cocina"), where("estado", "==", "PENDIENTE"));
    onSnapshot(qComandas, (snapshot) => {
      const contenedor = document.getElementById("contenedor-comandas");
      const contador = document.getElementById("contador-comandas");

      contador.textContent = `${snapshot.size} Pendientes`;

      if (!primeraCarga && snapshot.docChanges().some(change => change.type === 'added')) {
        reproducirAlarmaCocina();
      }
      primeraCarga = false;

      if (snapshot.empty) {
        contenedor.innerHTML = `<div class="text-center text-slate-400 text-sm py-8 col-span-full">No hay comandas pendientes. ¡Cocina al día!</div>`;
        return;
      }

      contenedor.innerHTML = "";
      snapshot.forEach((docSnap) => {
        const item = docSnap.data();
        const id = docSnap.id;
        const resumenLimpio = (item.resumen || '').replace(/'/g, "\\'");

        const card = document.createElement("div");
        card.className = "bg-slate-800 border border-amber-500/40 rounded-2xl p-4 space-y-3 shadow-lg flex flex-col justify-between";
        card.innerHTML = `
          <div class="space-y-2">
            <div class="flex justify-between items-center border-b border-slate-700 pb-2">
              <span class="font-black text-amber-400 text-base">${item.mesa || 'Mesa'}</span>
              <span class="bg-amber-500/20 text-amber-300 text-xs px-2.5 py-0.5 rounded-full font-bold">#${item.comanda || '101'}</span>
            </div>
            <p class="text-sm font-bold text-white leading-relaxed">${item.resumen}</p>
          </div>
          <button onclick="marcarComandaLista('${id}', '${item.mesa}', '${resumenLimpio}')" class="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-bold py-2.5 rounded-xl text-xs shadow transition active:scale-95 flex items-center justify-center gap-2">
            <i class="fa-solid fa-check"></i> Plato Listo para Servir
          </button>
        `;
        contenedor.appendChild(card);
      });
    });

    // 2. Listener Firebase para el Inventario / Menú (Control de Agotados)
    onSnapshot(collection(db, "inventario_insumos"), (snapshot) => {
      const contenedorMenu = document.getElementById("contenedor-control-menu");

      if (snapshot.empty) {
        contenedorMenu.innerHTML = `<div class="text-center text-slate-400 text-xs py-4 col-span-full">No hay productos registrados en el inventario.</div>`;
        return;
      }

      contenedorMenu.innerHTML = "";
      snapshot.forEach((docSnap) => {
        const plato = docSnap.data();
        const id = docSnap.id;
        const disponible = plato.disponible !== undefined ? plato.disponible : true;

        const card = document.createElement("div");
        card.className = `bg-slate-900 border rounded-xl p-3 flex justify-between items-center space-x-2 transition w-full ${
          disponible ? 'border-slate-700 shadow-sm' : 'border-rose-900/50 bg-rose-950/10'
        }`;

        card.innerHTML = `
          <div class="space-y-0.5 overflow-hidden min-w-0">
            <h3 class="font-bold text-xs text-white truncate">${plato.nombre}</h3>
            <p class="text-[10px] font-semibold ${disponible ? 'text-emerald-400' : 'text-rose-400'}">
              ${disponible ? '● Disponible' : '✕ Agotado'}
            </p>
          </div>
          <div class="shrink-0">
            <button onclick="toggleDisponibilidad('${id}', ${disponible})" class="${
              disponible 
                ? 'bg-rose-600 hover:bg-rose-500 text-white' 
                : 'bg-emerald-600 hover:bg-emerald-500 text-white'
            } px-3 py-1.5 rounded-lg text-xs font-bold transition active:scale-95 shadow">
              ${disponible ? 'Marcar Agotado' : 'Marcar Disponible'}
            </button>
          </div>
        `;
        contenedorMenu.appendChild(card);
      });
    });

    // Función para alternar disponibilidad del plato
    window.toggleDisponibilidad = async function(id, estadoActual) {
      try {
        await updateDoc(doc(db, "inventario_insumos", id), {
          disponible: !estadoActual
        });
      } catch (e) {
        console.error("Error al actualizar disponibilidad:", e);
        alert("⚠️ No se pudo actualizar el estado del plato.");
      }
    };

    window.marcarComandaLista = async function(id, mesa, resumen) {
      try {
        await updateDoc(doc(db, "pedidos_cocina", id), { estado: "LISTO" });
        await addDoc(collection(db, "alertas"), {
          mesa: mesa,
          resumen: resumen || "Orden completa",
          mensaje: `${mesa} • ${resumen || 'Orden lista para servir'}`,
          tipo: "PEDIDO_LISTO",
          atendido: false,
          fecha: new Date().toISOString()
        });
      } catch (e) {
        console.error("Error al actualizar comanda:", e);
      }
    };

    window.volverInicio = function() {
      window.location.href = 'index.html';
    };
  </script>
</body>
</html>
