<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BistroIQ - Menú del Cliente</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col">

  <!-- Encabezado del Cliente -->
  <header class="bg-slate-800 border-b border-slate-700 p-4 sticky top-0 z-50 flex justify-between items-center shadow-md">
    <div class="flex items-center gap-3">
      <i class="fa-solid fa-utensils text-amber-500 text-2xl"></i>
      <div>
        <h1 class="font-bold text-lg text-white">BistroIQ</h1>
        <p class="text-xs text-emerald-400 font-medium">Mesa #3 • Sesión Activa</p>
      </div>
    </div>
    <button onclick="volverInicio()" class="bg-slate-700 hover:bg-slate-600 text-slate-300 px-3 py-1.5 rounded-xl text-xs font-semibold transition">
      <i class="fa-solid fa-house"></i> Salir
    </button>
  </header>

  <!-- Contenido Principal -->
  <main class="flex-1 p-4 max-w-2xl mx-auto w-full space-y-6">

    <!-- Tarjeta de Acciones Rápidas -->
    <div class="bg-gradient-to-r from-amber-600 to-amber-700 rounded-2xl p-5 shadow-lg text-white">
      <h2 class="text-xl font-bold mb-1">¡Bienvenido a BistroIQ!</h2>
      <p class="text-amber-100 text-xs mb-4">Disfruta de nuestros platos y solicita asistencia cuando lo necesites.</p>
      <div class="grid grid-cols-2 gap-3">
        <button onclick="solicitarMesero()" class="bg-black/20 hover:bg-black/30 backdrop-blur-sm p-3 rounded-xl flex items-center justify-center gap-2 font-semibold text-sm transition active:scale-95">
          <i class="fa-solid fa-bell text-amber-300"></i> Llamar Mesero
        </button>
        <button onclick="pedirCuenta()" class="bg-emerald-700 hover:bg-emerald-600 p-3 rounded-xl flex items-center justify-center gap-2 font-semibold text-sm transition active:scale-95">
          <i class="fa-solid fa-credit-card text-emerald-200"></i> Pedir Cuenta
        </button>
      </div>
    </div>

    <!-- Sección de Pedido Actual -->
    <div class="bg-slate-800 border border-slate-700 rounded-2xl p-5 shadow-lg">
      <div class="flex justify-between items-center mb-4 pb-2 border-b border-slate-700">
        <h3 class="font-bold text-slate-200"><i class="fa-solid fa-receipt text-amber-500 mr-2"></i> Su Pedido Actual</h3>
        <span class="bg-amber-500/20 text-amber-400 text-xs px-2.5 py-1 rounded-full font-semibold">En Proceso</span>
      </div>

      <!-- Lista de Productos en el Pedido -->
      <div id="cliente-pedido-lista" class="space-y-3 mb-4">
        <div class="flex justify-between items-center bg-slate-900/50 p-3 rounded-xl">
          <div>
            <div class="font-bold text-sm text-white">Arroz con Pollo Especial</div>
            <div class="text-xs text-slate-400">Cantidad: 1 • Sin cebolla</div>
          </div>
          <span class="font-semibold text-amber-400 text-sm">$ 28.000 COP</span>
        </div>
        <div class="flex justify-between items-center bg-slate-900/50 p-3 rounded-xl">
          <div>
            <div class="font-bold text-sm text-white">Limonada de Coco</div>
            <div class="text-xs text-slate-400">Cantidad: 2</div>
          </div>
          <span class="font-semibold text-amber-400 text-sm">$ 16.000 COP</span>
        </div>
      </div>

      <!-- Total -->
      <div class="pt-3 border-t border-slate-700 flex justify-between items-center">
        <span class="text-sm text-slate-400 font-medium">Total a Pagar:</span>
        <span class="text-xl font-extrabold text-white" id="cliente-total">$ 44.000 COP</span>
      </div>
    </div>

  </main>

  <!-- Script de Navegación y Acciones -->
  <script>
    function volverInicio() {
      window.location.href = 'index.html';
    }

    function solicitarMesero() {
      alert('🔔 Se ha enviado una alerta a la mesera. Acudirá a su mesa en un momento.');
    }

    function pedirCuenta() {
      alert('💳 Solicitud de cuenta enviada a caja. El administrador se encargará de verificar el pago.');
    }
  </script>
</body>
</html>
