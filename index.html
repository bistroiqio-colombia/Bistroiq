<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BistroIQ - Portal de Acceso</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col items-center justify-center p-4">

  <!-- Encabezado Principal -->
  <div class="text-center mb-8">
    <div class="flex items-center justify-center gap-3 mb-2">
      <i class="fa-solid fa-utensils text-amber-500 text-4xl" aria-hidden="true"></i>
      <h1 class="text-4xl font-extrabold tracking-tight text-white">BistroIQ</h1>
    </div>
    <p class="text-slate-400 text-sm font-medium">Sistema Inteligente de Gestión de Restaurantes</p>
  </div>

  <!-- Contenedor de Botones de Roles -->
  <div class="w-full max-w-md space-y-4">
    
    <!-- Botón Cliente (Acceso Directo) -->
    <button onclick="accederCliente()" class="w-full bg-emerald-600 hover:bg-emerald-500 text-white p-5 rounded-2xl flex items-center justify-between shadow-lg transition duration-200 active:scale-95">
      <div class="flex items-center gap-4">
        <div class="bg-emerald-700/50 p-3 rounded-xl">
          <i class="fa-solid fa-qrcode text-2xl" aria-hidden="true"></i>
        </div>
        <div class="text-left">
          <div class="font-bold text-lg">Soy Cliente</div>
          <div class="text-xs text-emerald-200">Ver menú digital y hacer pedido</div>
        </div>
      </div>
      <i class="fa-solid fa-chevron-right text-emerald-300" aria-hidden="true"></i>
    </button>

    <!-- Botón Mesera (Con PIN) -->
    <button onclick="abrirModalPIN('mesera')" class="w-full bg-indigo-600 hover:bg-indigo-500 text-white p-5 rounded-2xl flex items-center justify-between shadow-lg transition duration-200 active:scale-95">
      <div class="flex items-center gap-4">
        <div class="bg-indigo-700/50 p-3 rounded-xl">
          <i class="fa-solid fa-user-ninja text-2xl" aria-hidden="true"></i>
        </div>
        <div class="text-left">
          <div class="font-bold text-lg">Soy Mesera</div>
          <div class="text-xs text-indigo-200">Gestionar mesas y comandas</div>
        </div>
      </div>
      <i class="fa-solid fa-lock text-indigo-300" aria-hidden="true"></i>
    </button>

    <!-- Botón Cocina (Con PIN) -->
    <button onclick="abrirModalPIN('cocina')" class="w-full bg-amber-600 hover:bg-amber-500 text-white p-5 rounded-2xl flex items-center justify-between shadow-lg transition duration-200 active:scale-95">
      <div class="flex items-center gap-4">
        <div class="bg-amber-700/50 p-3 rounded-xl">
          <i class="fa-solid fa-fire text-2xl" aria-hidden="true"></i>
        </div>
        <div class="text-left">
          <div class="font-bold text-lg">Soy Cocina</div>
          <div class="text-xs text-amber-200">Pantalla de pedidos e insumos</div>
        </div>
      </div>
      <i class="fa-solid fa-lock text-amber-300" aria-hidden="true"></i>
    </button>

    <!-- Botón Administrador / Caja (Con PIN) -->
    <button onclick="abrirModalPIN('administrador')" class="w-full bg-slate-800 hover:bg-slate-700 text-slate-200 border border-slate-700 p-5 rounded-2xl flex items-center justify-between shadow-lg transition duration-200 active:scale-95">
      <div class="flex items-center gap-4">
        <div class="bg-slate-900/50 p-3 rounded-xl">
          <i class="fa-solid fa-chart-line text-2xl text-amber-500" aria-hidden="true"></i>
        </div>
        <div class="text-left">
          <div class="font-bold text-lg">Administrador / Caja</div>
          <div class="text-xs text-slate-400">Reportes, métricas y control</div>
        </div>
      </div>
      <i class="fa-solid fa-shield-halved text-slate-500" aria-hidden="true"></i>
    </button>

  </div>

  <!-- MODAL DE TECLADO PIN -->
  <div id="modalPIN" class="fixed inset-0 bg-black/80 backdrop-blur-sm hidden items-center justify-center p-4 z-50">
    <div class="bg-slate-800 border border-slate-700 w-full max-w-xs rounded-3xl p-6 shadow-2xl text-center">
      <div class="flex justify-between items-center mb-4">
        <h3 id="tituloRol" class="text-lg font-bold text-slate-200">Ingresar PIN</h3>
        <button onclick="cerrarModalPIN()" class="text-slate-400 hover:text-white text-xl p-1" aria-label="Cerrar modal">&times;</button>
      </div>

      <!-- Display de PIN (Puntos) -->
      <div class="flex justify-center gap-3 mb-6">
        <div id="dot0" class="w-4 h-4 rounded-full border-2 border-slate-500"></div>
        <div id="dot1" class="w-4 h-4 rounded-full border-2 border-slate-500"></div>
        <div id="dot2" class="w-4 h-4 rounded-full border-2 border-slate-500"></div>
        <div id="dot3" class="w-4 h-4 rounded-full border-2 border-slate-500"></div>
      </div>

      <div id="mensajeError" class="text-red-400 text-xs font-semibold h-4 mb-2 hidden">PIN incorrecto. Intenta de nuevo.</div>

      <!-- Teclado Numérico -->
      <div class="grid grid-cols-3 gap-3">
        <button onclick="ingresarNumero('1')" class="bg-slate-700 hover:bg-slate-600 text-xl font-bold py-3 rounded-xl active:bg-slate-500 transition">1</button>
        <button onclick="ingresarNumero('2')" class="bg-slate-700 hover:bg-slate-600 text-xl font-bold py-3 rounded-xl active:bg-slate-500 transition">2</button>
        <button onclick="ingresarNumero('3')" class="bg-slate-700 hover:bg-slate-600 text-xl font-bold py-3 rounded-xl active:bg-slate-500 transition">3</button>
        <button onclick="ingresarNumero('4')" class="bg-slate-700 hover:bg-slate-600 text-xl font-bold py-3 rounded-xl active:bg-slate-500 transition">4</button>
        <button onclick="ingresarNumero('5')" class="bg-slate-700 hover:bg-slate-600 text-xl font-bold py-3 rounded-xl active:bg-slate-500 transition">5</button>
        <button onclick="ingresarNumero('6')" class="bg-slate-700 hover:bg-slate-600 text-xl font-bold py-3 rounded-xl active:bg-slate-500 transition">6</button>
        <button onclick="ingresarNumero('7')" class="bg-slate-700 hover:bg-slate-600 text-xl font-bold py-3 rounded-xl active:bg-slate-500 transition">7</button>
        <button onclick="ingresarNumero('8')" class="bg-slate-700 hover:bg-slate-600 text-xl font-bold py-3 rounded-xl active:bg-slate-500 transition">8</button>
        <button onclick="ingresarNumero('9')" class="bg-slate-700 hover:bg-slate-600 text-xl font-bold py-3 rounded-xl active:bg-slate-500 transition">9</button>
        <button onclick="borrarNumero()" class="bg-slate-700 text-amber-500 text-lg font-bold py-3 rounded-xl active:bg-slate-600 transition" aria-label="Borrar número"><i class="fa-solid fa-backspace" aria-hidden="true"></i></button>
        <button onclick="ingresarNumero('0')" class="bg-slate-700 hover:bg-slate-600 text-xl font-bold py-3 rounded-xl active:bg-slate-500 transition">0</button>
        <button onclick="validarPIN()" class="bg-emerald-600 hover:bg-emerald-500 text-white text-lg font-bold py-3 rounded-xl active:bg-emerald-700 transition" aria-label="Validar PIN"><i class="fa-solid fa-check" aria-hidden="true"></i></button>
      </div>
    </div>
  </div>

  <script>
    const PINS = {
      cocina: '1234',
      administrador: '9999',
      meseras: {
        '2222': 'María',
        '4721': 'Esther',
        '3572': 'Juana',
        '2717': 'Karina'
      }
    };

    let pinActual = '';
    let rolSeleccionado = '';

    function accederCliente() {
      window.location.href = 'cliente.html';
    }

    function abrirModalPIN(rol) {
      rolSeleccionado = rol;
      pinActual = '';
      actualizarDots();
      document.getElementById('mensajeError').classList.add('hidden');
      
      const titulos = {
        cocina: 'PIN de Cocina',
        administrador: 'PIN de Administrador',
        mesera: 'PIN de Mesera'
      };
      document.getElementById('tituloRol').innerText = titulos[rol];
      document.getElementById('modalPIN').classList.remove('hidden');
      document.getElementById('modalPIN').classList.add('flex');
    }

    function cerrarModalPIN() {
      document.getElementById('modalPIN').classList.add('hidden');
      document.getElementById('modalPIN').classList.remove('flex');
    }

    function ingresarNumero(num) {
      if (pinActual.length < 4) {
        pinActual += num;
        actualizarDots();
        if (pinActual.length === 4) {
          validarPIN();
        }
      }
    }

    function borrarNumero() {
      if (pinActual.length > 0) {
        pinActual = pinActual.slice(0, -1);
        actualizarDots();
      }
    }

    function actualizarDots() {
      for (let i = 0; i < 4; i++) {
        const dot = document.getElementById(`dot${i}`);
        if (i < pinActual.length) {
          dot.classList.add('bg-amber-500', 'border-amber-500');
          dot.classList.remove('border-slate-500');
        } else {
          dot.classList.remove('bg-amber-500', 'border-amber-500');
          dot.classList.add('border-slate-500');
        }
      }
    }

    function validarPIN() {
      if (rolSeleccionado === 'cocina') {
        if (pinActual === PINS.cocina) {
          window.location.href = 'Cocina.html';
        } else {
          mostrarError();
        }
      } else if (rolSeleccionado === 'administrador') {
        if (pinActual === PINS.administrador) {
          window.location.href = 'administrador.html';
        } else {
          mostrarError();
        }
      } else if (rolSeleccionado === 'mesera') {
        if (PINS.meseras[pinActual]) {
          const nombreMesera = PINS.meseras[pinActual];
          localStorage.setItem('meseraActiva', nombreMesera);
          window.location.href = 'mesera.html';
        } else {
          mostrarError();
        }
      }
    }

    function mostrarError() {
      document.getElementById('mensajeError').classList.remove('hidden');
      pinActual = '';
      actualizarDots();
    }
  </script>
</body>
</html>
