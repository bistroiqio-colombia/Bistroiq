<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BistroIQ - Portal de Acceso</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    body { background: linear-gradient(135deg, #1f2937, #111827); }
  </style>
</head>
<body class="min-h-screen text-white flex flex-col justify-between p-4">

  <!-- Encabezado -->
  <header class="text-center py-6">
    <h1 class="text-4xl font-extrabold tracking-wide text-amber-500 flex items-center justify-center gap-2">
      <i class="fa-solid fa-utensils"></i> BistroIQ
    </h1>
    <p class="text-gray-400 text-sm mt-1">Sistema Inteligente de Gestión de Restaurantes</p>
  </header>

  <!-- Botones de Selección de Rol -->
  <main class="max-w-md w-full mx-auto space-y-4 my-auto">
    
    <!-- Cliente -->
    <button onclick="accederCliente()" class="w-full bg-emerald-600 hover:bg-emerald-500 text-white p-5 rounded-2xl shadow-lg flex items-center justify-between transition transform active:scale-95">
      <div class="flex items-center gap-4">
        <div class="bg-emerald-700 p-3 rounded-xl"><i class="fa-solid fa-qrcode text-2xl"></i></div>
        <div class="text-left">
          <p class="font-bold text-lg">Soy Cliente</p>
          <p class="text-xs text-emerald-200">Ver menú digital y hacer pedido</p>
        </div>
      </div>
      <i class="fa-solid fa-chevron-right text-emerald-200"></i>
    </button>

    <!-- Mesera -->
    <button onclick="abrirModalPIN('mesera')" class="w-full bg-indigo-600 hover:bg-indigo-500 text-white p-5 rounded-2xl shadow-lg flex items-center justify-between transition transform active:scale-95">
      <div class="flex items-center gap-4">
        <div class="bg-indigo-700 p-3 rounded-xl"><i class="fa-solid fa-user-ninja text-2xl"></i></div>
        <div class="text-left">
          <p class="font-bold text-lg">Soy Mesera</p>
          <p class="text-xs text-indigo-200">Gestionar mesas y comandas</p>
        </div>
      </div>
      <i class="fa-solid fa-lock text-indigo-200"></i>
    </button>

    <!-- Cocina -->
    <button onclick="abrirModalPIN('cocina')" class="w-full bg-amber-600 hover:bg-amber-500 text-white p-5 rounded-2xl shadow-lg flex items-center justify-between transition transform active:scale-95">
      <div class="flex items-center gap-4">
        <div class="bg-amber-700 p-3 rounded-xl"><i class="fa-solid fa-fire-burner text-2xl"></i></div>
        <div class="text-left">
          <p class="font-bold text-lg">Soy Cocina</p>
          <p class="text-xs text-amber-200">Pantalla de pedidos e insumos</p>
        </div>
      </div>
      <i class="fa-solid fa-lock text-amber-200"></i>
    </button>

    <!-- Administrador -->
    <button onclick="abrirModalPIN('admin')" class="w-full bg-slate-800 hover:bg-slate-700 text-white p-5 rounded-2xl shadow-lg border border-slate-700 flex items-center justify-between transition transform active:scale-95">
      <div class="flex items-center gap-4">
        <div class="bg-slate-900 p-3 rounded-xl"><i class="fa-solid fa-chart-line text-2xl text-amber-400"></i></div>
        <div class="text-left">
          <p class="font-bold text-lg">Administrador / Caja</p>
          <p class="text-xs text-gray-400">Reportes, métricas y control</p>
        </div>
      </div>
      <i class="fa-solid fa-shield-halved text-gray-400"></i>
    </button>

  </main>

  <!-- Modal Teclado PIN -->
  <div id="modalPIN" class="fixed inset-0 bg-black/80 backdrop-blur-sm hidden flex items-center justify-center p-4 z-50">
    <div class="bg-gray-900 border border-gray-800 p-6 rounded-3xl max-w-xs w-full text-center shadow-2xl">
      <h3 id="modalTitulo" class="text-xl font-bold text-white mb-1">Ingresa tu PIN</h3>
      <p id="modalSubtitulo" class="text-xs text-gray-400 mb-4">Acceso restringido</p>

      <!-- Indicadores del PIN -->
      <div class="flex justify-center gap-3 mb-6">
        <div id="dot0" class="w-4 h-4 rounded-full border-2 border-amber-500"></div>
        <div id="dot1" class="w-4 h-4 rounded-full border-2 border-amber-500"></div>
        <div id="dot2" class="w-4 h-4 rounded-full border-2 border-amber-500"></div>
        <div id="dot3" class="w-4 h-4 rounded-full border-2 border-amber-500"></div>
      </div>

      <!-- Teclado Numérico -->
      <div class="grid grid-cols-3 gap-3 mb-4">
        <button onclick="pressKey('1')" class="bg-gray-800 hover:bg-gray-700 text-white font-bold py-3 rounded-xl text-xl">1</button>
        <button onclick="pressKey('2')" class="bg-gray-800 hover:bg-gray-700 text-white font-bold py-3 rounded-xl text-xl">2</button>
        <button onclick="pressKey('3')" class="bg-gray-800 hover:bg-gray-700 text-white font-bold py-3 rounded-xl text-xl">3</button>
        <button onclick="pressKey('4')" class="bg-gray-800 hover:bg-gray-700 text-white font-bold py-3 rounded-xl text-xl">4</button>
        <button onclick="pressKey('5')" class="bg-gray-800 hover:bg-gray-700 text-white font-bold py-3 rounded-xl text-xl">5</button>
        <button onclick="pressKey('6')" class="bg-gray-800 hover:bg-gray-700 text-white font-bold py-3 rounded-xl text-xl">6</button>
        <button onclick="pressKey('7')" class="bg-gray-800 hover:bg-gray-700 text-white font-bold py-3 rounded-xl text-xl">7</button>
        <button onclick="pressKey('8')" class="bg-gray-800 hover:bg-gray-700 text-white font-bold py-3 rounded-xl text-xl">8</button>
        <button onclick="pressKey('9')" class="bg-gray-800 hover:bg-gray-700 text-white font-bold py-3 rounded-xl text-xl">9</button>
        <button onclick="cerrarModalPIN()" class="bg-red-900/50 hover:bg-red-900 text-red-200 font-bold py-3 rounded-xl text-sm">Cancelar</button>
        <button onclick="pressKey('0')" class="bg-gray-800 hover:bg-gray-700 text-white font-bold py-3 rounded-xl text-xl">0</button>
        <button onclick="borrarKey()" class="bg-gray-800 hover:bg-gray-700 text-amber-400 font-bold py-3 rounded-xl"><i class="fa-solid fa-backspace"></i></button>
      </div>

      <p id="errorPIN" class="text-red-400 text-xs hidden">PIN incorrecto, intenta de nuevo.</p>
    </div>
  </div>

  <footer class="text-center py-4 text-xs text-gray-500">
    BistroIQ v2.0 &bull; Impulsado por Inteligencia Digital
  </footer>

  <script>
    // Configuración de PINs
    const PINS = {
      cocina: '1234',
      admin: '9999',
      meseras: {
        '2222': 'María',
        '4721': 'Esther',
        '3572': 'Juana',
        '2717': 'Karina'
      }
    };

    let rolSeleccionado = '';
    let pinActual = '';

    function accederCliente() {
      window.location.href = 'Cliente.html';
    }

    function abrirModalPIN(rol) {
      rolSeleccionado = rol;
      pinActual = '';
      actualizarDots();
      document.getElementById('errorPIN').classList.add('hidden');

      const titulo = document.getElementById('modalTitulo');
      const subtitulo = document.getElementById('modalSubtitulo');

      if (rol === 'mesera') {
        titulo.innerText = 'PIN de Mesera';
        subtitulo.innerText = 'Ingresa tu PIN personal de 4 dígitos';
      } else if (rol === 'cocina') {
        titulo.innerText = 'Acceso a Cocina';
        subtitulo.innerText = 'Ingresa el PIN de cocina';
      } else if (rol === 'admin') {
        titulo.innerText = 'Acceso Administrador';
        subtitulo.innerText = 'Ingresa la clave maestra';
      }

      document.getElementById('modalPIN').classList.remove('hidden');
    }

    function cerrarModalPIN() {
      document.getElementById('modalPIN').classList.add('hidden');
      pinActual = '';
    }

    function pressKey(num) {
      if (pinActual.length < 4) {
        pinActual += num;
        actualizarDots();
        if (pinActual.length === 4) {
          validarPIN();
        }
      }
    }

    function borrarKey() {
      if (pinActual.length > 0) {
        pinActual = pinActual.slice(0, -1);
        actualizarDots();
      }
    }

    function actualizarDots() {
      for (let i = 0; i < 4; i++) {
        const dot = document.getElementById(`dot${i}`);
        if (i < pinActual.length) {
          dot.className = 'w-4 h-4 rounded-full bg-amber-500 border-2 border-amber-500';
        } else {
          dot.className = 'w-4 h-4 rounded-full border-2 border-amber-500';
        }
      }
    }

    function validarPIN() {
      if (rolSeleccionado === 'cocina') {
        if (pinActual === PINS.cocina) {
          window.location.href = 'Cocina.html';
        } else {
          mostrarError();
        }
      } else if (rolSeleccionado === 'admin') {
        if (pinActual === PINS.admin) {
          window.location.href = 'administrador.html';
        } else {
          mostrarError();
        }
      } else if (rolSeleccionado === 'mesera') {
        if (PINS.meseras[pinActual]) {
          const nombreMesera = PINS.meseras[pinActual];
          localStorage.setItem('meseraActiva', nombreMesera);
          window.location.href = 'mesera.html';
        } else {
          mostrarError();
        }
      }
    }

    function mostrarError() {
      document.getElementById('errorPIN').classList.remove('hidden');
      pinActual = '';
      setTimeout(actualizarDots, 300);
    }
  </script>
</body>
</html>
