<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BistroIQ - Portal Principal</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col items-center justify-center p-4">

  <div class="max-w-md w-full space-y-6 text-center">
    
    <!-- Encabezado / Logo Original -->
    <div class="space-y-2">
      <div class="inline-block bg-emerald-500/20 p-3 rounded-2xl border border-emerald-500/30">
        <i class="fa-solid fa-utensils text-emerald-400 text-3xl" aria-hidden="true"></i>
      </div>
      <h1 class="text-3xl font-black text-white">Bistro<span class="text-emerald-400">IQ</span></h1>
      <p class="text-xs text-slate-400">Sistema Inteligente de Gestión de Restaurantes</p>
    </div>

    <!-- Módulos -->
    <div class="space-y-3.5 text-left">

      <!-- Soy Cliente (Verde - Libre sin PIN) -->
      <a href="cliente.html" class="bg-emerald-600 hover:bg-emerald-500 p-4 rounded-2xl flex items-center justify-between shadow-lg transition group block text-white">
        <div class="flex items-center gap-3.5">
          <div class="bg-black/10 p-3 rounded-xl text-white">
            <i class="fa-solid fa-qrcode text-lg" aria-hidden="true"></i>
          </div>
          <div>
            <h3 class="font-bold text-base">Soy Cliente</h3>
            <p class="text-xs text-emerald-100">Ver menú digital y hacer pedido</p>
          </div>
        </div>
        <i class="fa-solid fa-chevron-right text-emerald-200 group-hover:translate-x-1 transition" aria-hidden="true"></i>
      </a>

      <!-- Soy Mesera (Azul - Acceso libre para demostración) -->
      <a href="mesera.html" class="bg-indigo-600 hover:bg-indigo-500 p-4 rounded-2xl flex items-center justify-between shadow-lg transition group block text-white">
        <div class="flex items-center gap-3.5">
          <div class="bg-black/10 p-3 rounded-xl text-white">
            <i class="fa-solid fa-user-tie text-lg" aria-hidden="true"></i>
          </div>
          <div>
            <h3 class="font-bold text-base">Soy Mesera</h3>
            <p class="text-xs text-indigo-100">Gestionar mesas y comandas</p>
          </div>
        </div>
        <i class="fa-solid fa-chevron-right text-indigo-200 group-hover:translate-x-1 transition" aria-hidden="true"></i>
      </a>

      <!-- Soy Cocina (Naranja - Acceso libre para demostración) -->
      <a href="Cocina.html" class="bg-amber-600 hover:bg-amber-500 p-4 rounded-2xl flex items-center justify-between shadow-lg transition group block text-white">
        <div class="flex items-center gap-3.5">
          <div class="bg-black/10 p-3 rounded-xl text-white">
            <i class="fa-solid fa-fire text-lg" aria-hidden="true"></i>
          </div>
          <div>
            <h3 class="font-bold text-base">Soy Cocina</h3>
            <p class="text-xs text-amber-100">Pantalla de pedidos e insumos</p>
          </div>
        </div>
        <i class="fa-solid fa-chevron-right text-amber-200 group-hover:translate-x-1 transition" aria-hidden="true"></i>
      </a>

      <!-- Administrador / Caja (Oscuro - Protegido por PIN) -->
      <button onclick="verificarAcceso('administrador.html', 'admin')" class="w-full bg-slate-800 hover:bg-slate-700/80 border border-slate-700 p-4 rounded-2xl flex items-center justify-between shadow-lg transition group text-white cursor-pointer text-left">
        <div class="flex items-center gap-3.5">
          <div class="bg-purple-500/20 p-3 rounded-xl text-purple-400">
            <i class="fa-solid fa-chart-line text-lg" aria-hidden="true"></i>
          </div>
          <div>
            <h3 class="font-bold text-base">Administrador / Caja</h3>
            <p class="text-xs text-slate-400">Reportes, métricas y control</p>
          </div>
        </div>
        <div class="flex items-center gap-2">
          <i class="fa-solid fa-lock text-purple-400 text-xs" aria-hidden="true"></i>
          <i class="fa-solid fa-chevron-right text-slate-400 group-hover:translate-x-1 transition" aria-hidden="true"></i>
        </div>
      </button>

    </div>

    <footer class="text-xs text-slate-500 pt-2">
      BistroIQ • Todos los derechos reservados
    </footer>

  </div>

  <!-- Lógica de Verificación de PIN solo para Administrador con Firebase -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    // Configuración Firebase BistroIQ Colombia
    const firebaseConfig = {
      apiKey: "AIzaSyDV780O1ZNeTaGFI3vCTbHpiLAzHO1hIf8",
      authDomain: "bistroiq-colombia.firebaseapp.com",
      projectId: "bistroiq-colombia",
      storageBucket: "bistroiq-colombia.firebasestorage.app",
      messagingSenderId: "745222925239",
      appId: "1:745222925239:web:12d0ecca6b65f1e15c1632"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    window.verificarAcceso = async function(paginaDestino, tipoModulo) {
      const pinIngresado = prompt(`🔒 Ingrese el PIN de seguridad del Administrador:`);
      
      if (pinIngresado === null) return; // Si el usuario cancela

      try {
        const docRef = doc(db, "configuracion", "claves_sistema");
        const docSnap = await getDoc(docRef);

        let pinEsperado = docSnap.exists() && docSnap.data().pinAdmin ? docSnap.data().pinAdmin : "9999";

        if (pinIngresado.trim() === pinEsperado) {
          window.location.href = paginaDestino;
        } else {
          alert(`❌ PIN incorrecto. Acceso denegado al módulo de Administrador.`);
        }
      } catch (e) {
        console.error("Error verificando PIN:", e);
        // Respaldo offline por si falla Firebase en la demo
        if (pinIngresado.trim() === "9999") {
          window.location.href = paginaDestino;
        } else {
          alert("⚠️ PIN incorrecto o error de conexión.");
        }
      }
    };
  </script>

</body>
</html>
